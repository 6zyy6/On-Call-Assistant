<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Call 助手</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6fb;
      color: #0f172a;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 20px 28px;
      display: grid;
      gap: 16px;
    }
    .hero {
      display: grid;
      gap: 6px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }
    .subtitle {
      margin: 0;
      color: #64748b;
    }
    .chat-shell {
      display: grid;
      gap: 14px;
      min-height: 72vh;
      background: #ffffff;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      padding: 16px;
    }
    #history {
      min-height: 480px;
      display: grid;
      align-content: start;
      gap: 12px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .empty {
      color: #64748b;
      padding: 8px 0;
    }
    .message {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      background: #fff;
    }
    .message.user {
      border-color: #bfdbfe;
      background: #eff6ff;
    }
    .message.assistant {
      border-color: #bbf7d0;
      background: #f0fdf4;
    }
    .message.assistant.streaming {
      box-shadow: inset 0 0 0 1px rgba(34, 197, 94, 0.18);
    }
    .label {
      margin-bottom: 6px;
      font-size: 12px;
      color: #64748b;
    }
    .content {
      line-height: 1.72;
      word-break: break-word;
    }
    .content p {
      margin: 0 0 10px;
    }
    .content p:last-child {
      margin-bottom: 0;
    }
    .content h1, .content h2, .content h3 {
      margin: 0 0 10px;
      line-height: 1.4;
    }
    .content h1 { font-size: 22px; }
    .content h2 { font-size: 18px; }
    .content h3 { font-size: 16px; }
    .content ul, .content ol {
      margin: 0 0 10px 20px;
      padding: 0;
    }
    .content li {
      margin: 0 0 6px;
    }
    .content blockquote {
      margin: 0 0 10px;
      padding: 8px 12px;
      border-left: 3px solid #94a3b8;
      background: rgba(148, 163, 184, 0.08);
      color: #334155;
    }
    .content hr {
      border: 0;
      border-top: 1px solid #cbd5e1;
      margin: 12px 0;
    }
    .content pre {
      margin: 10px 0;
      padding: 12px;
      border-radius: 6px;
      background: #0f172a;
      color: #e2e8f0;
      overflow-x: auto;
    }
    .content code {
      font-family: Consolas, monospace;
      background: rgba(15, 23, 42, 0.08);
      border-radius: 4px;
      padding: 1px 4px;
    }
    .content pre code {
      background: transparent;
      padding: 0;
    }
    .content a {
      color: #2563eb;
    }
    .tool-trace {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.05);
      color: #475569;
      font-size: 13px;
    }
    .tool-trace:empty {
      display: none;
    }
    .tool-event {
      line-height: 1.5;
    }
    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
    }
    .composer > div {
      min-width: 0;
    }
    textarea, button {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    textarea {
      width: 100%;
      min-height: 104px;
      max-height: 220px;
      padding: 12px 14px;
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
    }
    button {
      min-width: 120px;
      height: 46px;
      padding: 0 18px;
      background: #2563eb;
      border-color: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .hint {
      font-size: 13px;
      color: #64748b;
    }
    @media (max-width: 720px) {
      .composer {
        grid-template-columns: 1fr;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <h1>On-Call 助手</h1>
      <p class="subtitle">通过自然语言提问，助手会按需读取 `data/` 下的 SOP，并实时展示工具调用过程与回复。</p>
    </div>
    <section class="chat-shell">
      <div id="history">
        <div class="empty">还没有对话。比如问：`Ingress 大量 502 应该先查什么？`</div>
      </div>
      <form id="chat-form" class="composer">
        <div>
          <textarea id="message" placeholder="输入 On-Call 问题，例如：支付接口大量超时，我先排查什么？"></textarea>
          <div class="hint">Enter 发送，Shift+Enter 换行</div>
        </div>
        <button id="send" type="submit">发送</button>
      </form>
    </section>
  </main>
  <script>
    const historyEl = document.getElementById("history");
    const form = document.getElementById("chat-form");
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const conversation = [];

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function removeEmptyState() {
      const empty = historyEl.querySelector(".empty");
      if (empty) empty.remove();
    }

    function renderEmptyState() {
      if (historyEl.children.length === 0) {
        historyEl.innerHTML = '<div class="empty">还没有对话。比如问：`Ingress 大量 502 应该先查什么？`</div>';
      }
    }

    function normalizeMarkdownSource(source) {
      return source.replace(/\r\n/g, "\n").replace(/\r/g, "\n").replace(/\n{3,}/g, "\n\n");
    }

    function renderInlineMarkdown(text) {
      return escapeHtml(text)
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>");
    }

    function renderMarkdown(source) {
      const normalized = normalizeMarkdownSource(source);
      const lines = normalized.split("\n");
      const blocks = [];
      let inCode = false;
      let codeLines = [];
      let listType = "";
      let listItems = [];
      let quoteLines = [];

      function flushList() {
        if (!listItems.length) return;
        const tag = listType === "ol" ? "ol" : "ul";
        blocks.push(`<${tag}>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</${tag}>`);
        listType = "";
        listItems = [];
      }

      function flushQuote() {
        if (!quoteLines.length) return;
        blocks.push(`<blockquote>${quoteLines.map((item) => `<p>${renderInlineMarkdown(item)}</p>`).join("")}</blockquote>`);
        quoteLines = [];
      }

      function flushCode() {
        if (!inCode) return;
        blocks.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        inCode = false;
        codeLines = [];
      }

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        if (line.startsWith("```")) {
          flushQuote();
          flushList();
          if (inCode) {
            flushCode();
          } else {
            inCode = true;
            codeLines = [];
          }
          continue;
        }
        if (inCode) {
          codeLines.push(rawLine);
          continue;
        }

        const trimmed = line.trim();
        if (!trimmed) {
          flushQuote();
          flushList();
          continue;
        }

        const orderedMatch = trimmed.match(/^\d+\.\s+(.*)$/);
        const bulletMatch = trimmed.match(/^[-*]\s+(.*)$/);
        const quoteMatch = trimmed.match(/^>\s?(.*)$/);

        if (quoteMatch) {
          flushList();
          quoteLines.push(quoteMatch[1]);
          continue;
        }

        flushQuote();
        if (orderedMatch) {
          if (listType && listType !== "ol") flushList();
          listType = "ol";
          listItems.push(orderedMatch[1]);
          continue;
        }
        if (bulletMatch) {
          if (listType && listType !== "ul") flushList();
          listType = "ul";
          listItems.push(bulletMatch[1]);
          continue;
        }

        flushList();
        const headingMatch = trimmed.match(/^(#{1,3})\s+(.*)$/);
        if (headingMatch) {
          const level = headingMatch[1].length;
          blocks.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
          continue;
        }
        if (/^(-{3,}|\*{3,})$/.test(trimmed)) {
          blocks.push("<hr>");
          continue;
        }

        blocks.push(`<p>${renderInlineMarkdown(trimmed)}</p>`);
      }

      flushQuote();
      flushList();
      flushCode();
      return blocks.join("");
    }

    function addMessage(role, content, useMarkdown = false, beforeNode = null) {
      removeEmptyState();
      const item = document.createElement("div");
      item.className = `message ${role}`;

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = role === "user" ? "用户" : role === "assistant" ? "助手" : "工具";

      const body = document.createElement("div");
      body.className = "content";
      if (useMarkdown) {
        body.innerHTML = renderMarkdown(content);
      } else {
        body.textContent = content;
      }

      item.append(label, body);
      if (beforeNode && beforeNode.parentNode === historyEl) {
        historyEl.insertBefore(item, beforeNode);
      } else {
        historyEl.appendChild(item);
      }
      historyEl.scrollTop = historyEl.scrollHeight;
      return { item, body };
    }

    function addAssistantMessage() {
      removeEmptyState();
      const item = document.createElement("div");
      item.className = "message assistant";

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = "助手";

      const trace = document.createElement("div");
      trace.className = "tool-trace";

      const body = document.createElement("div");
      body.className = "content";
      body.innerHTML = renderMarkdown("正在思考...");

      item.append(label, trace, body);
      historyEl.appendChild(item);
      historyEl.scrollTop = historyEl.scrollHeight;
      return { item, body, trace };
    }

    function addToolEvent(assistantMessage, content) {
      const event = document.createElement("div");
      event.className = "tool-event";
      event.textContent = content;
      assistantMessage.trace.appendChild(event);
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    async function consumeEventStream(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split("\n\n");
        buffer = frames.pop() || "";

        for (const frame of frames) {
          const dataLines = frame
            .split("\n")
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trim());
          for (const line of dataLines) {
            if (line) onEvent(JSON.parse(line));
          }
        }
      }
    }

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = messageInput.value.trim();
      if (!message) return;

      addMessage("user", message);
      conversation.push({ role: "user", content: message });
      messageInput.value = "";
      sendButton.disabled = true;

      const assistantMessage = addAssistantMessage();
      assistantMessage.item.classList.add("streaming");

      let reply = "";
      let paintQueued = false;

      function paintReply(isFinal = false) {
        paintQueued = false;
        assistantMessage.body.innerHTML = renderMarkdown(reply || (isFinal ? "我暂时还没有整理出可靠结论。" : ""));
        if (isFinal) assistantMessage.item.classList.remove("streaming");
        historyEl.scrollTop = historyEl.scrollHeight;
      }

      function queuePaint() {
        if (paintQueued) return;
        paintQueued = true;
        window.requestAnimationFrame(() => paintReply(false));
      }

      try {
        const response = await fetch("/v3/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history: conversation.slice(0, -1) }),
        });

        if (!response.ok || !response.body) {
          assistantMessage.body.textContent = "请求失败。";
          assistantMessage.item.classList.remove("streaming");
          conversation.push({ role: "assistant", content: "请求失败。" });
          return;
        }

        assistantMessage.body.innerHTML = "";
        await consumeEventStream(response, (eventPayload) => {
          if (eventPayload.type === "reply_delta") {
            reply += eventPayload.delta || "";
            queuePaint();
            return;
          }

          if (eventPayload.type === "tool_call" || eventPayload.type === "status") {
            addToolEvent(assistantMessage, eventPayload.message || "");
            return;
          }

          if (eventPayload.type === "error") {
            reply = eventPayload.message || "请求失败。";
            assistantMessage.body.innerHTML = renderMarkdown(reply);
            assistantMessage.item.classList.remove("streaming");
            return;
          }

          if (eventPayload.type === "done") {
            reply = eventPayload.reply || reply;
            paintReply(true);
          }
        });

        conversation.push({ role: "assistant", content: reply || "我暂时还没有整理出可靠结论。" });
      } catch (error) {
        assistantMessage.body.textContent = "请求失败，请检查服务或网络配置。";
        assistantMessage.item.classList.remove("streaming");
        conversation.push({ role: "assistant", content: "请求失败，请检查服务或网络配置。" });
      } finally {
        sendButton.disabled = false;
        messageInput.focus();
        renderEmptyState();
      }
    });
  </script>
</body>
</html>
